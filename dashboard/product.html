<script>
(() => {
  const nativeFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    const response = await nativeFetch(input, init);

    const contentType = response.headers.get('content-type') || '';
    if (contentType.toLowerCase().includes('application/json')) {
      if (!response.ok) {
        const copy = await response.clone().json().catch(() => ({}));
        copy.error = copy.error === 'METHOD_NOT_ALLOWED' ? '保存失败：后端接口未正确连接。' : (copy.message || copy.error || '保存失败，请稍后重试。');

      return response;

      drawer.dataset.stabilityDecorated='1';
    } catch (_) { drawer.dataset.stabilityDecorated=''; /* the main drawer remains usable even if action controls cannot be decorated */ }
  }

  setTimeout(decorateTimeline, 250);
  document.addEventListener('click', async event => {
    const recheck = event.target.closest('[data-stability-recheck-job]');
    if (recheck) {
      event.stopImmediatePropagation();
      try {
        const snap = await (await fetch('/api/master/snapshot', {cache:'no-store'})).json();
        const job = (snap.jobs || []).find(x => x.job_id === recheck.dataset.stabilityRecheckJob); if (!job) throw Error('岗位不存在，请刷新后重试。');

      const snap = await (await fetch('/api/master/snapshot', {cache:'no-store'})).json();

    } catch (err) { alert(err.message); }
  }, true);
  document.addEventListener('click', async event => {
    const button=event.target.closest('[data-stability-save-event],[data-stability-cancel]'); if(!button)return; event.stopImmediatePropagation();
    if(button.dataset.stabilityCancel){document.getElementById('modalbg').classList.remove('open');return;}
    try { await api('/api/master/application/event/update',{event_id:button.dataset.stabilitySaveEvent,event_type:document.getElementById('st-event-type').value,event_date:document.getElementById('st-event-date').value,event_time:document.getElementById('st-event-time').value,deadline:document.getElementById('st-event-deadline').value,round:document.getElementById('st-event-round').value,notes:document.getElementById('st-event-notes').value}); document.getElementById('modalbg').classList.remove('open');document.getElementById('drawerbg').classList.remove('open');document.querySelector('[data-refresh]')?.click(); } catch(err){alert(err.message)}
  }, true);
})();
</script>
<script>
const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>!v?'—':String(v).slice(0,10),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Hong_Kong'});let S={},page='home',tab=0,jf='all',af='all',month=new Date('2026-08-01');const stage={Applied:'已投递','Online Assessment':'在线测评',Interview:'面试',Offer:'Offer / 录用',Rejected:'已拒绝',Withdrawn:'已撤回',Submitted:'已投递'},events={'Applied':'已投递','OA Received':'收到在线测评','OA Completed':'完成在线测评','Interview Invitation':'收到面试邀请','Interview Completed':'完成面试','Assessment Centre':'评估中心','Offer':'收到 Offer','Rejected':'被拒绝','Withdrawn':'主动撤回','Follow-up':'跟进','Other':'其他'},mzh={'CV / Resume':'简历','Cover Letter':'求职信','Portfolio':'作品集','Transcript':'成绩单','Certificate':'证书','Reference':'推荐材料','Other':'其他'};const tag=(x,c='')=>`<span class="tag ${c}">${esc(x)}</span>`,post=(u,b={})=>window.__careerPilotApiRequest(u,{method:'POST',body:b}),parsed=(r,k)=>{try{return JSON.parse((r||[]).find(x=>x.key===k)?.value||'{}')}catch{return{}}},setting=k=>(S.settings||[]).find(x=>x.key===k)?.value||'',cur=a=>a.current_stage||a.status||'Applied',ver=id=>(S.materialVersions||[]).find(x=>x.material_version_id===id),links=(id,role='CV')=>(S.applicationMaterials||[]).filter(x=>x.application_id===id&&x.role===role&&!x.deleted_at),appEv=id=>(S.applicationEvents||[]).filter(x=>x.application_id===id&&!x.deleted_at).sort((a,b)=>`${b.event_date} ${b.event_time}`.localeCompare(`${a.event_date} ${a.event_time}`));

function home(){let ce=calEvents().filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5),rec=S.applications.filter(a=>a.status!=='Skipped').sort((a,b)=>b.attempt_date.localeCompare(a.attempt_date)).slice(0,4),cnt={pending:S.activeJobs.length,applied:0,oa:0,int:0,offer:0};S.applications.forEach(a=>{let s=cur(a);s==='Online Assessment'?cnt.oa++:s==='Interview'?cnt.int++:s==='Offer'?cnt.offer++:a.status!=='Skipped'&&cnt.applied++});$('home').innerHTML=`<div class="head"><div><h1>今天要做什么？</h1><p>${today()} · 只显示需要行动的事项</p></div><div class="actions"><button class="btn" data-go="jobs">找新岗位</button><button class="btn primary" data-add-job>添加岗位</button></div></div><div class="grid2 section"><div class="surface"><div class="between"><h2>今日待办</h2><button class="btn" data-go="calendar">日历</button></div>${ce.map(e=>`<div class="todo" data-open-event="${e.id}"><div class="date">${e.date.slice(5)}</div><div><b>${esc(e.company)} · ${esc(e.title)}</b><div class="sub">${esc(e.type)} ${e.time?`· ${e.time}`:''}</div></div></div>`).join('')||'<div class="empty">未来没有已记录事项</div>'}</div><div class="surface"><div class="between"><h2>最近申请</h2><button class="btn" data-go="apps">全部</button></div>${rec.map(a=>`<div class="todo" data-app="${a.application_id}"><div><b>${esc(a.company)}</b><div class="sub">${esc(a.job_title)} · ${stage[cur(a)]||cur(a)}</div></div></div>`).join('')}</div></div><div class="section"><h2>求职进度</h2><div class="progress">${[['待处理',cnt.pending],['已投递',cnt.applied],['OA',cnt.oa],['面试',cnt.int],['Offer',cnt.offer]].map(x=>`<div class="metric"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}</div></div><div class="section"><div class="between"><h2>推荐岗位</h2><button class="btn" data-go="jobs">岗位池</button></div>${table(S.activeJobs.sort((a,b)=>+b.priority-+a.priority).slice(0,5))}</div>`}

function jobs(){let d=defaults(),run=[...(S.searchRuns||[])].sort((a,b)=>b.created_at.localeCompare(a.created_at))[0],rows=S.jobs.filter(j=>!j.deleted_at&&(jf==='invalid'?j.current_validity!=='Validated + Active':jf==='all'?['Potential','To Review','Interested','To Apply'].includes(j.status)&&j.current_validity==='Validated + Active':j.status===jf));$('jobs').innerHTML=`<div class="head"><div><h1>岗位</h1><p>搜索 → 验证 → 去重 → 保存</p></div><button class="btn primary" data-add-job>+ 手动添加</button></div><div class="search"><div class="between"><h2>搜索岗位</h2><span class="sub">默认读取求职偏好</span></div><div class="form"><div class="field"><label>地区</label><input id="sloc" value="${esc(d.loc)}"></div><div class="field"><label>岗位方向</label><input id="sroles" value="${esc(d.roles)}"></div><div class="field"><label>毕业年份</label><input id="syear" value="2027"></div><div class="field"><label>公司类型</label><input id="sco" value="大型企业；跨国公司；金融机构"></div><div class="field"><label>关键词</label><input id="skw" value="${esc(d.kw)}"></div><div class="field"><label>排除关键词</label><input id="sneg" value="${esc(d.neg)}"></div><div class="field full"><label>来源</label><div class="checks">${['公司官网','官方 ATS','LinkedIn','JobsDB','CTgoodjobs'].map(x=>`<label><input type="checkbox" data-source value="${x}" checked> ${x}</label>`).join('')}</div></div></div><div class="run"><span class="sub">应用关闭时不会后台搜索；不会假装已搜索。</span><button class="btn blue" data-start-search>开始搜索</button></div>${run?`<div class="notice" style="margin-top:13px">最近请求：${run.status==='Requested'?'等待执行':esc(run.status)} · 发现 ${run.found_count||0} · 新增 ${run.new_count||0} · 失效 ${run.invalid_count||0}</div>`:''}</div><div class="filters">${[['all','全部'],['To Review','待查看'],['Interested','感兴趣'],['To Apply','待投递'],['invalid','已失效']].map(x=>`<button data-jf="${x[0]}" class="${jf===x[0]?'active':''}">${x[1]}</button>`).join('')}</div>${table(rows)}`}
function apps(){let rows=S.applications.filter(a=>a.status!=='Skipped'&&(af==='all'||cur(a)===af));$('apps').innerHTML=`<div class="head"><div><h1>我的申请</h1><p>一次记录，时间线、阶段、日历和首页自动联动</p></div></div><div class="filters">${[['all','全部'],['Applied','已投递'],['Online Assessment','在线测评'],['Interview','面试'],['Offer','Offer'],['Rejected','拒绝']].map(x=>`<button data-af="${x[0]}" class="${af===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="tablebox"><table class="table"><thead><tr><th>公司 / 职位</th><th>阶段</th><th>投递日期</th><th>使用简历</th><th>下一步</th></tr></thead><tbody>${rows.map(a=>{let l=links(a.application_id).find(x=>/Confirmed/.test(x.mapping_status)),v=l&&ver(l.material_version_id),cand=links(a.application_id).find(x=>x.mapping_status==='Candidate'),n=appEv(a.application_id).find(x=>x.deadline);return`<tr data-app="${a.application_id}"><td><b>${esc(a.company)}</b><div class="sub">${esc(a.job_title)}</div></td><td>${tag(stage[cur(a)]||cur(a),'blue')}</td><td>${fmt(a.attempt_date)}</td><td>${v?esc(v.file_name):cand?tag('待确认','amber'):'待补充'}</td><td>${n?fmt(n.deadline)+' · '+(events[n.event_type]||n.event_type):'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function calendar(){let es=calEvents(),y=month.getFullYear(),m=month.getMonth(),f=new Date(y,m,1),start=new Date(y,m,1-f.getDay()),ds=Array.from({length:42},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i)),up=es.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);$('calendar').innerHTML=`<div class="head"><div><h1>求职日历</h1><p>所有日期来自岗位和申请事件</p></div><button class="btn primary" data-add-event>+ 添加事项</button></div><div class="calgrid"><div class="calendar"><div class="between"><button class="btn" data-prev>‹</button><b>${y} 年 ${m+1} 月</b><button class="btn" data-next>›</button></div><div class="month">${['日','一','二','三','四','五','六'].map(x=>`<div class="week">${x}</div>`).join('')}${ds.map(d=>{let day=d.toLocaleDateString('en-CA'),list=es.filter(e=>e.date===day);return`<div class="day ${d.getMonth()!==m?'dim':''}">${d.getDate()}${list.slice(0,3).map(e=>`<div class="event" data-open-event="${e.id}">${esc(e.type)} · ${esc(e.company||e.title)}</div>`).join('')}</div>`}).join('')}</div></div><aside class="surface"><h2>即将发生</h2>${up.map(e=>`<div class="todo" data-open-event="${e.id}"><div class="date">${e.date.slice(5)}</div><div><b>${esc(e.company||e.title)}</b><div class="sub">${esc(e.type)} ${e.time?`· ${e.time}`:''}</div></div></div>`).join('')||'<div class="empty">暂无事项</div>'}</aside></div>`}
function materials(){let libs=S.materialLibrary.filter(x=>!x.deleted_at),vs=S.materialVersions;const group=(title,arr)=>`<div class="section"><div class="between"><h2>${title}</h2><span class="sub">${arr.length} 组</span></div><div class="surface">${arr.map(m=>{let v=ver(m.latest_version_id)||vs.filter(x=>x.material_id===m.material_id).sort((a,b)=>b.modified_at.localeCompare(a.modified_at))[0],n=vs.filter(x=>x.material_id===m.material_id).length;return`<div class="material"><div><b>${esc(m.display_name)}</b><div class="sub">${esc(m.company||m.role_family||'通用资料')}</div></div><div>${tag(mzh[m.material_type]||m.material_type)}</div><div class="sub">${n} 个文件 / 版本<br>${v?fmt(v.modified_at):'—'}</div><button class="btn" data-open-version="${v?.material_version_id||''}">预览</button></div>`}).join('')||'<div class="empty">暂无资料</div>'}</div></div>`;return`<div class="pathbox"><b>资料位置</b><div class="pathline"><input id="mpath" value="${esc(setting('materials_root'))}"><button class="btn" data-browse>浏览</button><button class="btn" data-open-folder>打开文件夹</button><button class="btn primary" data-rescan>重新扫描</button></div><div class="sub">上次扫描：${fmt(setting('materials_last_scanned'))} · ${esc(setting('materials_scan_status'))}</div></div>${group('通用资料库',libs.filter(x=>x.library_section==='General Library'))}${group('公司 / 申请资料',libs.filter(x=>x.library_section==='Company Application'))}`}
function mine(){let c=parsed(S.profile,'candidate'),p=parsed(S.preferences,'targets');$('mine').innerHTML=`<div class="head"><div><h1>我的</h1><p>资料、偏好和设置</p></div></div><div class="tabs">${window.CAREERPILOT_NAV.renderMyTabs(tab)}</div>${tab===0?`<div class="surface"><div class="form">${[['姓名','name'],['常用名','preferred_name'],['邮箱','email'],['电话','phone'],['所在地','location'],['语言','languages'],['大学','university'],['学位','degree'],['毕业日期','graduation_date'],['工作资格','visa_status']].map(x=>`<div class="field"><label>${x[0]}</label><input data-profile="${x[1]}" value="${esc(c[x[1]]||'')}"></div>`).join('')}</div><div class="run"><span></span><button class="btn primary" data-save-profile>保存</button></div></div>`:tab===1?`<div class="surface"><div class="form">${[['岗位方向','target_role_families'],['地区','locations'],['项目类型','programme_types'],['偏好行业','preferred_industries'],['偏好雇主','preferred_employers'],['关键词','keywords'],['排除关键词','negative_keywords']].map(x=>`<div class="field"><label>${x[0]}</label><textarea data-pref="${x[1]}">${esc(Array.isArray(p[x[1]])?p[x[1]].join('; '):(p[x[1]]||''))}</textarea></div>`).join('')}</div><div class="run"><span></span><button class="btn primary" data-save-pref>保存</button></div></div>`:tab===2?materials():tab===3?`<div class="notice">保存的搜索用条件展示；应用关闭后不会自动运行。原始提示词放在高级设置。</div>${S.routines.map(r=>`<div class="surface" style="margin-top:13px"><div class="between"><div><h2>${esc(r.name)}</h2><div class="sub">${r.status==='Enabled'?'已启用':'已停用'} · 手动运行 · 最近 ${fmt(r.last_run)}</div></div><button class="btn" data-run-routine="${r.routine_id}">立即搜索</button></div><details><summary>高级：原始搜索提示词</summary><textarea data-r-prompt style="width:100%">${esc(r.prompt||'')}</textarea><button class="btn" data-save-routine="${r.routine_id}">保存</button></details></div>`).join('')}`:`<div class="surface"><h2>数据与设置</h2><table class="table"><tr><td>岗位</td><td>${S.summary.total}</td></tr><tr><td>申请</td><td>${S.summary.applications}</td></tr><tr><td>资料版本</td><td>${S.materialVersions.length}</td></tr><tr><td>同步</td><td>${tag('已同步','green')}</td></tr></table><details><summary>高级</summary><p class="sub">主数据、内部版本和审计信息仅在此处显示。</p><a class="btn" href="/api/master/download">下载主数据</a></details></div>`}`}
function render(){home();jobs();apps();calendar();mine();go(page)}function openDrawer(h){$('drawer').dataset.stabilityDecorated='';$('drawer').dataset.stabilityJobDecorated='';$('drawer').innerHTML=h;$('drawerbg').classList.add('open');setTimeout(()=>window.__decorateTimeline?.(),0)}function openModal(h){$('modal').innerHTML=h;$('modalbg').classList.add('open')}function closeD(){$('drawerbg').classList.remove('open')}function closeM(){$('modalbg').classList.remove('open')}
function jobDrawer(j){openDrawer(`<div class="between">${tag(j.current_validity==='Validated + Active'?'✓ 职位有效':'待验证',j.current_validity==='Validated + Active'?'green':'amber')}<button class="btn" data-close>关闭</button></div><h2>${esc(j.job_title)}</h2><p class="sub">${esc(j.company)} · ${esc(j.location)}</p><div class="sep"><b>岗位信息</b><p>项目：${esc(j.programme_type||'—')}<br>截止：${fmt(j.application_deadline)}<br>匹配：${esc(j.priority||'—')}</p></div><div class="sep"><b>备注</b><p>${esc(j.notes||'—')}</p></div><details><summary>查看验证信息</summary><p class="sub">${esc(j.validation_reason||'—')}<br>最后检查 ${fmt(j.last_checked)}</p></details><div class="actions" style="margin-top:20px"><button class="btn primary" data-url="${esc(j.job_url)}">打开职位</button>${['Potential','To Review','Interested','To Apply'].includes(j.status)?`<button class="btn blue" data-mark="${j.job_id}">标记已投递</button>`:''}<button class="btn" data-delete="${j.job_id}">删除</button></div>`)}
function appDrawer(a){let es=appEv(a.application_id),ls=links(a.application_id),ok=ls.find(x=>/Confirmed/.test(x.mapping_status)),v=ok&&ver(ok.material_version_id),cand=ls.find(x=>x.mapping_status==='Candidate'),cv=cand&&ver(cand.material_version_id);openDrawer(`<div class="between">${tag(stage[cur(a)]||cur(a),'blue')}<button class="btn" data-close>关闭</button></div><h2>${esc(a.job_title)}</h2><p class="sub">${esc(a.company)}</p><div class="sep"><div class="between"><b>申请资料快照</b>${!ok?`<button class="btn" data-choose-cv="${a.application_id}">补充使用简历</button>`:''}</div>${v?`<p><b>${esc(v.file_name)}</b><br><span class="sub">已保存申请快照 · ${ok.file_hash.slice(0,12)}…</span></p>`:'<p class="sub">尚未确认当时使用的简历。</p>'}${cand?`<div class="candidate"><b>发现可能使用的简历</b><div>${esc(cv?.file_name||'')}</div><button class="btn" data-confirm-candidate="${cand.application_material_id}">确认是这一份</button></div>`:''}</div><div class="sep"><div class="between"><b>申请时间线</b><button class="btn primary" data-record="${a.application_id}">记录进展</button></div><div class="timeline">${es.map(e=>`<div><b>${fmt(e.event_date)} · ${events[e.event_type]||e.event_type}${e.round?' · '+esc(e.round):''}</b><span class="sub">${e.deadline?'截止 '+fmt(e.deadline)+' · ':''}${esc(e.notes||'')}</span></div>`).join('')}</div></div>`)}
const formInput=(id,label,type='text',value='')=>`<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`;
function recordModal(id){openModal(`<h2>记录进展</h2><div class="form"><div class="field"><label>发生了什么？</label><select id="etype">${Object.entries(events).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div>${formInput('edate','日期','date',today())}${formInput('etime','时间（可选）','time')}${formInput('edeadline','截止日期（如适用）','date')}${formInput('eround','轮次')}<div class="field full"><label>备注</label><textarea id="enotes"></textarea></div></div><div class="run"><span></span><div class="actions"><button class="btn" data-cancel>取消</button><button class="btn primary" data-save-progress="${id}">保存进展</button></div></div>`)}
function chooseCv(id){let opts=S.materialLibrary.filter(x=>x.material_type==='CV / Resume'&&!x.deleted_at).flatMap(m=>S.materialVersions.filter(v=>v.material_id===m.material_id&&!v.missing_at).map(v=>`<option value="${v.material_version_id}">${esc(m.display_name)} · ${esc(v.file_name)} · ${fmt(v.modified_at)}</option>`));openModal(`<h2>补充当时使用的简历</h2><p class="notice">请选择申请当时实际提交的版本。系统会保存快照，之后更新最新版不会改变历史。</p><div class="field"><label>简历版本</label><select id="cvver"><option value="">请选择</option>${opts.join('')}</select></div><div class="run"><span></span><div><button class="btn" data-cancel>取消</button> <button class="btn primary" data-save-cv="${id}">确认</button></div></div>`)}
function markModal(j){let opts=S.materialLibrary.filter(x=>x.material_type==='CV / Resume'&&!x.deleted_at).map(m=>`<option value="${m.latest_version_id}">${esc(m.display_name)}</option>`);openModal(`<h2>标记已投递</h2><div class="form">${formInput('mdate','申请日期','date',today())}<div class="field"><label>使用简历</label><select id="mcv"><option value="">待补充</option>${opts.join('')}</select></div>${formInput('mchannel','渠道','text',j.source)}<div class="field full"><label>备注</label><textarea id="mnotes"></textarea></div></div><div class="run"><span></span><div><button class="btn" data-cancel>取消</button> <button class="btn primary" data-mark-save="${j.job_id}">确认</button></div></div>`)}
function addJob(){openModal(`<h2>手动添加岗位</h2><div class="form"><div class="field full"><label>职位链接</label><input id="jurl" type="url"></div>${formInput('jco','公司')}${formInput('jtitle','职位')}${formInput('jloc','地点','text','Hong Kong')}${formInput('jdl','截止日期','date')}${formInput('jtype','项目类型','text','Graduate / Entry-level')}</div><div class="run"><span></span><div><button class="btn" data-cancel>取消</button> <button class="btn primary" data-add-save>保存</button></div></div>`)}
function addEvent(){openModal(`<h2>添加独立事项</h2><p class="sub">在线测评和面试请在申请时间线中记录，避免重复。</p><div class="form">${formInput('ctitle','标题')}${formInput('cco','公司')}<div class="field"><label>类型</label><select id="ctype"><option value="Follow-up">跟进</option><option value="Recruitment Event">招聘活动</option><option value="Career Fair">招聘会</option><option value="Other">其他</option></select></div>${formInput('cdate','日期','date',today())}${formInput('ctime','时间','time')}<div class="field full"><label>备注</label><textarea id="cnotes"></textarea></div></div><div class="run"><span></span><div><button class="btn" data-cancel>取消</button> <button class="btn primary" data-event-save>保存</button></div></div>`)}
document.addEventListener('click',async e=>{let b=e.target.closest('button,[data-job],[data-app],[data-open-event]');if(!b)return;try{if(b.dataset.view){go(b.dataset.view);return}if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.refresh!==undefined){await load();return}if(b.dataset.addJob!==undefined){addJob();return}if(b.dataset.job){jobDrawer(S.jobs.find(x=>x.job_id===b.dataset.job));return}if(b.dataset.app){appDrawer(S.applications.find(x=>x.application_id===b.dataset.app));return}if(b.dataset.openEvent){let x=calEvents().find(v=>v.id===b.dataset.openEvent);if(x?.application_id)appDrawer(S.applications.find(a=>a.application_id===x.application_id));else if(x?.job_id)jobDrawer(S.jobs.find(j=>j.job_id===x.job_id));return}if(b.dataset.close!==undefined){closeD();return}if(b.dataset.cancel!==undefined){closeM();return}if(b.dataset.jf){jf=b.dataset.jf;jobs();return}if(b.dataset.af){af=b.dataset.af;apps();return}if(b.dataset.tab!==undefined){tab=+b.dataset.tab;mine();return}if(b.dataset.prev!==undefined){month.setMonth(month.getMonth()-1);calendar();return}if(b.dataset.next!==undefined){month.setMonth(month.getMonth()+1);calendar();return}if(b.dataset.url){open(b.dataset.url,'_blank','noopener');return}if(b.dataset.mark){markModal(S.jobs.find(x=>x.job_id===b.dataset.mark));return}if(b.dataset.record){recordModal(b.dataset.record);return}if(b.dataset.chooseCv){chooseCv(b.dataset.chooseCv);return}if(b.dataset.addEvent!==undefined){addEvent();return}if(b.dataset.openVersion){open('/api/master/material/version-file?id='+encodeURIComponent(b.dataset.openVersion),'_blank');return}
if(b.dataset.saveProgress){await post('/api/master/application/event/add',{application_id:b.dataset.saveProgress,event_type:$('etype').value,event_date:$('edate').value,event_time:$('etime').value,deadline:$('edeadline').value,round:$('eround').value,notes:$('enotes').value});closeM();closeD();await load();appDrawer(S.applications.find(x=>x.application_id===b.dataset.saveProgress));return}if(b.dataset.saveCv){if(!$('cvver').value)throw Error('请选择简历');await post('/api/master/application/material/confirm',{application_id:b.dataset.saveCv,role:'CV',material_version_id:$('cvver').value});closeM();closeD();await load();appDrawer(S.applications.find(x=>x.application_id===b.dataset.saveCv));return}if(b.dataset.confirmCandidate){let l=S.applicationMaterials.find(x=>x.application_material_id===b.dataset.confirmCandidate);await post('/api/master/application/material/confirm',{application_id:l.application_id,role:'CV',material_version_id:l.material_version_id});closeD();await load();appDrawer(S.applications.find(x=>x.application_id===l.application_id));return}if(b.dataset.markSave){let j=S.jobs.find(x=>x.job_id===b.dataset.markSave);await post('/api/master/job/mark-applied',{job_id:j.job_id,expected_version:j.version,application_date:$('mdate').value,resume_material_version_id:$('mcv').value,application_channel:$('mchannel').value,notes:$('mnotes').value});closeM();closeD();await load();return}if(b.dataset.addSave!==undefined){await post('/api/master/job/add',{job_url:$('jurl').value,company:$('jco').value,job_title:$('jtitle').value,location:$('jloc').value,application_deadline:$('jdl').value,programme_type:$('jtype').value,status:'To Review',source:'Manual'});closeM();await load();return}if(b.dataset.eventSave!==undefined){await post('/api/master/calendar/add',{title:$('ctitle').value,event_type:$('ctype').value,company:$('cco').value,event_date:$('cdate').value,event_time:$('ctime').value,notes:$('cnotes').value});closeM();await load();return}if(b.dataset.startSearch!==undefined){let src=[...document.querySelectorAll('[data-source]:checked')].map(x=>x.value).join('; '),r=await post('/api/master/search/run/create',{location:$('sloc').value,role_families:$('sroles').value,graduation_year:$('syear').value,company_types:$('sco').value,keywords:$('skw').value,negative_keywords:$('sneg').value,sources:src});alert(`搜索请求已创建：${r.search_run_id}\n状态：等待在 Codex 中执行。`);await load();return}if(b.dataset.runRoutine){let r=S.routines.find(x=>x.routine_id===b.dataset.runRoutine);await post('/api/master/search/run/create',{routine_id:r.routine_id,location:'Hong Kong',role_families:r.name,graduation_year:'2027',sources:'公司官网; 官方 ATS; LinkedIn; JobsDB; CTgoodjobs'});await load();tab=3;mine();return}if(b.dataset.browse!==undefined){let r=await post('/api/master/material/browse-folder');if(!r.cancelled)$('mpath').value=r.path;return}if(b.dataset.openFolder!==undefined){await post('/api/master/material/open-folder',{path:$('mpath').value});return}if(b.dataset.rescan!==undefined){let p=$('mpath').value;await post('/api/master/settings/save',{key:'materials_root',value:p,value_type:'path'});let r=await post('/api/master/material/rescan',{path:p});alert(`扫描完成：${r.files} 个文件；新增/新版本 ${r.added}`);await load();tab=2;mine();return}if(b.dataset.saveProfile!==undefined){let rows=S.profile.map(x=>({...x})),c=parsed(rows,'candidate');document.querySelectorAll('[data-profile]').forEach(x=>c[x.dataset.profile]=x.value);rows.find(x=>x.key==='candidate').value=JSON.stringify(c);await post('/api/master/profile/save',{rows});alert('已保存');await load();return}if(b.dataset.savePref!==undefined){let rows=S.preferences.map(x=>({...x})),p=parsed(rows,'targets');document.querySelectorAll('[data-pref]').forEach(x=>p[x.dataset.pref]=x.value);rows.find(x=>x.key==='targets').value=JSON.stringify(p);await post('/api/master/preferences/save',{rows});alert('已保存');await load();return}if(b.dataset.saveRoutine){let r=S.routines.find(x=>x.routine_id===b.dataset.saveRoutine),box=b.closest('.surface');await post('/api/master/routine/update',{routine_id:r.routine_id,prompt:box.querySelector('[data-r-prompt]').value});await load();return}if(b.dataset.delete){let j=S.jobs.find(x=>x.job_id===b.dataset.delete);if(confirm('移入回收站？')){await post('/api/master/job/trash',{job_id:j.job_id,expected_version:j.version});closeD();await load()}return}}catch(err){alert(err.message)}});$('drawerbg').onclick=e=>{if(e.target===$('drawerbg'))closeD()};$('modalbg').onclick=e=>{if(e.target===$('modalbg'))closeM()};load().catch(e=>$('home').innerHTML=`<div class="notice">加载失败：${esc(e.message)}</div>`);
</script><script src="/i18n.js"></script><script src="/workflow_views.js"></script><script src="/stability_patch.js"></script><script src="/search_prompt.js"></script><script src="/materials_actions.js"></script><script src="/application_materials.js"></script><script src="/profile_views.js"></script><script src="/materials_views.js"></script><script src="/resume_version_views.js"></script><script src="/reminder_settings.js"></script></body></html>
